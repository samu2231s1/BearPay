<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout seguro · BearPay</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/app.css"><style>body{display:grid;place-items:center;padding:24px}.checkout{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow)}.summary{padding:48px;background:linear-gradient(145deg,#123b55,#081720)}.summary h1{font-size:42px;letter-spacing:-.06em}.pay{padding:48px}.secure{color:var(--ok);font-size:12px}.back{position:fixed;top:22px;left:22px;text-decoration:none}@media(max-width:700px){.checkout{grid-template-columns:1fr}.summary,.pay{padding:28px}}</style></head><body><a class="back" href="/">← BearPay</a><main class="checkout"><section class="summary"><a class="brand" href="/"><span class="bear-mark">B</span>BearPay</a><p style="margin-top:60px;color:#a7bdcb">Você está comprando</p><h1 id="productName">Pagamento seguro</h1><h2 id="productPrice">Valor informado no checkout</h2><p class="secure">✓ Ambiente protegido · Pagamento via Pix</p></section><section class="pay"><h2>Seus dados</h2><p style="color:var(--muted)">Preencha para gerar o QR Code Pix.</p><form id="checkoutForm"><div class="field"><span>Nome completo</span><input name="payerName" required></div><div class="field"><span>CPF</span><input name="payerDocument" required inputmode="numeric"></div><div class="field"><span>E-mail</span><input name="email" type="email" required></div><div class="field"><span>Valor</span><input name="amount" type="number" min="2" step=".01" required></div><button class="primary wide">Gerar Pix</button></form><div id="checkoutResult"></div></section></main><script type="module" src="/assets/checkout.js"></script></body></html>
